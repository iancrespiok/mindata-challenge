services:

  kafka:
    image: apache/kafka:3.7.1
    container_name: hotel-search-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: hotelSearchKRaftCluster01
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: hotel-search-oracle
    shm_size: '1gb'
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle_root_pwd
      ORACLE_DATABASE: MINDATA_CHALLENGE_DB
      APP_USER: hotel_search
      APP_USER_PASSWORD: hotel_search
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - oracle-data:/opt/oracle/oradata

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-search-app
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_URL: jdbc:oracle:thin:@//oracle:1521/MINDATA_CHALLENGE_DB
      DB_USER: hotel_search
      DB_PASSWORD: hotel_search
    depends_on:
      kafka:
        condition: service_healthy
      oracle:
        condition: service_healthy

volumes:
  oracle-data:
